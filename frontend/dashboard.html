<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GridAlign Dashboard
    </title>

    <link rel="icon" type="image/jpeg" href="/css/icon.jpg">
    <!-- Main styles -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css?v=4"
    >


    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <div class="dashboard-page">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="dashboard-header">


            <div class="dashboard-brand">

                <h1>
                    GridAlign
                </h1>

                <span>
                    Utility Coordination Intelligence
                </span>

            </div>


            <div class="dashboard-header-right">

                <span class="system-status">
                    System Online
                </span>


                <button
                    class="logout-button"
                    id="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>


        </header>


        <!-- =========================
             MAIN
        ========================== -->

        <main class="dashboard-main">


            <!-- =========================
                 SIDEBAR
            ========================== -->

            <aside class="dashboard-sidebar">


                <!-- =========================
                     OVERVIEW
                ========================== -->

                <section class="sidebar-section">

                    <h2>
                        Overview
                    </h2>


                    <div class="stat-card">

                        <span
                            class="stat-number"
                            id="stat-matches"
                        >
                            --
                        </span>

                        <span class="stat-label">
                            Matches
                        </span>

                    </div>


                    <div class="stat-card">

                        <span
                            class="stat-number"
                            id="stat-utilities"
                        >
                            --
                        </span>

                        <span class="stat-label">
                            Utilities
                        </span>

                    </div>


                    <div class="stat-card">

                        <span
                            class="stat-number"
                            id="stat-projects"
                        >
                            --
                        </span>

                        <span class="stat-label">
                            Projects
                        </span>

                    </div>

                </section>


                <!-- =========================
                     SYSTEM CONTROLS
                ========================== -->

                <section class="sidebar-section">

                    <h2>
                        System Controls
                    </h2>


                    <!-- PROJECT DATA -->

                    <div class="control-block">

                        <button
                            class="control-button"
                            id="refresh-data"
                            type="button"
                        >
                            Refresh Project Data
                        </button>


                        <div
                            class="job-log"
                            id="refresh-data-log"
                            aria-live="polite"
                        ></div>

                    </div>


                    <!-- MATCHER -->

                    <div class="control-block">

                        <button
                            class="control-button"
                            id="run-matcher"
                            type="button"
                        >
                            Run Project Matcher
                        </button>


                        <div
                            class="job-log"
                            id="run-matcher-log"
                            aria-live="polite"
                        ></div>

                    </div>


                    <!-- REPORTS -->

                    <div class="control-block">

                        <button
                            class="control-button"
                            id="generate-reports"
                            type="button"
                        >
                            Generate AI Reports
                        </button>


                        <div
                            class="job-log"
                            id="generate-reports-log"
                            aria-live="polite"
                        ></div>

                    </div>

                </section>


                <!-- =========================
                     UTILITIES
                ========================== -->

                


            </aside>


            <!-- =========================
                 CONTENT
            ========================== -->

            <section class="dashboard-content">


                <section class="map-section">


                    <div class="section-header">

                        <div>

                            <h2>
                                Project Matches
                            </h2>

                            <p>
                                Geographic coordination opportunities
                                within 40 km.
                            </p>

                        </div>

                    </div>


                    <div id="map"></div>


                </section>


            </section>


        </main>


    </div>


    <!-- =========================
         LEAFLET
    ========================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- =========================
         GRIDALIGN JS
    ========================== -->

    <script src="/js/map.js?v=4"></script>

    <script src="/js/dashboard.js?v=4"></script>


</body>

</html>
